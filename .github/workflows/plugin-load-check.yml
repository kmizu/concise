name: plugin loads in Claude Code

# Runs the hook and flag-script tests on Ubuntu and Windows, then installs the
# plugin from this checkout into a scratch CLAUDE_CONFIG_DIR and fails if it
# does not reach "enabled". Catches load-layer breakage that schema validation
# misses.
on:
  pull_request:
    paths:
      - .claude-plugin/**
      - commands/**
      - hooks/**
      - skills/**
      - tests/**
      - evals/**
      - codex/**
      - scripts/**
      - .agents/plugins/**
      - LICENSE
      - logo.svg
      - .github/workflows/plugin-load-check.yml
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the hook and the flag script
        run: python -m unittest discover -s tests -v
      - name: Replay the recorded Claude Code pilot (validates hashes and review; not a quality gate)
        run: python scripts/evaluate_responses.py evals/claude-code/pilot.json

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate manifests
        run: claude plugin validate .
      - name: Install the plugin from this checkout into a scratch config
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-scratch"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install concise@concise
          claude plugin list | tee plugin-list.txt
          grep -q "✔ enabled" plugin-list.txt || {
            echo "::error::plugin failed to load; see claude plugin list output above"
            exit 1
          }
